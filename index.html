<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapPost 行銷快手 — 下載</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#1c2733; --sub:#6b7a8c;
          --pri:#2f6f4f; --pri-h:#275d42; --chip:#eef2f0; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Microsoft JhengHei",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:760px; margin:0 auto; padding:28px 16px; }
  .hero { text-align:center; padding:36px 0 26px; }
  .hero h1 { font-size:30px; letter-spacing:1px; }
  .hero p { color:var(--sub); margin-top:10px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:16px; }
  .dlbtn { display:inline-block; background:var(--pri); color:#fff; text-decoration:none; font-size:17px;
           padding:14px 34px; border-radius:10px; margin-top:14px; }
  .dlbtn:hover { background:var(--pri-h); }
  .vchip { background:var(--chip); border-radius:6px; padding:3px 10px; font-size:13px; display:inline-block; }
  .muted { color:var(--sub); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--sub); font-weight:600; }
  a.plain { color:var(--pri); }
  .foot { text-align:center; margin-top:22px; font-size:14px; }
  .foot a { color:var(--pri); text-decoration:none; margin:0 10px; }
  h2 { font-size:17px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>SnapPost 行銷快手</h1>
    <p>Facebook 粉專自動化行銷工具 — 批次發送、排程管理、成效追蹤</p>
  </div>

  <div class="card" style="text-align:center" id="latest">
    <div class="muted">載入中...</div>
  </div>

  <div class="card">
    <h2>歷史版本</h2>
    <table><thead><tr><th>版本</th><th>日期</th><th>說明</th><th></th></tr></thead>
    <tbody id="hist"><tr><td colspan="4" class="muted">載入中...</td></tr></tbody></table>
  </div>

  <div class="foot">
    <a href="portal.html">會員登入查詢</a>｜<a href="admin.html">管理後台</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xsagokraqdmcmbjvctwy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzYWdva3JhcWRtY21ianZjdHd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzg4OTksImV4cCI6MjEwNjYxNDg5OX0.MEaRqWq7EREH0LPklw-3ERRwvcA2PMuhjpyH5lQUVMw";
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/sp_get_downloads', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_limit: 50 })
    });
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) {
      document.getElementById('latest').innerHTML = '<div class="muted">目前沒有可下載的版本</div>';
      return;
    }
    const top = rows[0];
    document.getElementById('latest').innerHTML =
      '<span class="vchip">最新版 v' + esc(top.version) + '（' + esc(top.released_at) + '）</span>' +
      '<div style="margin-top:10px">' + esc(top.release_notes || '') + '</div>' +
      '<a class="dlbtn" href="' + esc(top.download_url) + '">下載安裝檔</a>' +
      '<div class="muted" style="margin-top:12px">Windows 10/11 · 安裝後開啟即可註冊試用</div>';
    document.getElementById('hist').innerHTML = rows.slice(1).map(v =>
      '<tr><td>v' + esc(v.version) + '</td><td style="white-space:nowrap">' + esc(v.released_at) + '</td>' +
      '<td>' + esc(v.release_notes || '') + '</td>' +
      '<td><a class="plain" href="' + esc(v.download_url) + '">下載</a></td></tr>'
    ).join('') || '<tr><td colspan="4" class="muted">無</td></tr>';
  } catch (e) {
    document.getElementById('latest').innerHTML = '<div class="muted">載入失敗，請重新整理</div>';
  }
}
load();
</script>
</body>
</html>
